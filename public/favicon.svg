<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170">
<!-- Logo « pingouin dans le croissant » : piste 3b (clair) par défaut, piste 3a (sombre) si le navigateur est en mode sombre. -->
<style>
.bg{fill:#f3efe6}.moon{fill:#1f6b3c}.body{fill:#0f1412}.outline{fill:#0f1412;stroke:#0f1412}.belly{fill:#f3efe6}.gold{fill:#d9a441}
@media (prefers-color-scheme:dark){.bg{fill:#0f1412}.moon{fill:#9fe0a8}.outline{stroke:#9fe0a8}.gold{fill:#e8c27a}}
</style>
<rect width="170" height="170" rx="36" class="bg"/>
<mask id="m"><rect width="170" height="170" fill="#fff"/><circle cx="112" cy="62" r="64" fill="#000"/></mask>
<g transform="translate(85 85) scale(.9) translate(-85 -85)">
<circle cx="85" cy="85" r="76" class="moon" mask="url(#m)"/>
<g transform="translate(100 98) scale(.62)">
<ellipse cx="0" cy="10" rx="30" ry="42" class="outline" stroke-width="5"/><circle cx="0" cy="-30" r="22" class="outline" stroke-width="5"/>
<ellipse cx="0" cy="12" rx="22" ry="32" class="body"/><ellipse cx="0" cy="18" rx="19" ry="28" class="belly"/>
<circle cx="-8" cy="-34" r="5" class="belly"/><circle cx="8" cy="-34" r="5" class="belly"/>
<circle cx="-7" cy="-33" r="2.4" class="body"/><circle cx="9" cy="-33" r="2.4" class="body"/>
<ellipse cx="0" cy="-23" rx="9" ry="5" class="gold"/><ellipse cx="-14" cy="52" rx="13" ry="6" class="gold"/><ellipse cx="14" cy="52" rx="13" ry="6" class="gold"/>
</g>
</g>
</svg>
